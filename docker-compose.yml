services:
  postgres:
    image: postgres:16-alpine
    container_name: evchargeops-postgres
    environment:
      POSTGRES_USER: chargeops
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chargeops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
